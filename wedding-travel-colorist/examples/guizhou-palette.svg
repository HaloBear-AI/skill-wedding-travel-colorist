  <rect x="92" y="98" width="390" height="61" fill="#59483E" />
  <rect x="487" y="98" width="225" height="61" fill="#89979A" />
  <rect x="717" y="98" width="101" height="61" fill="#CDD1CB" />
  <text x="21" y="215" font-family="system-ui,sans-serif" font-size="22" fill="#3B312B">暮色</text>
